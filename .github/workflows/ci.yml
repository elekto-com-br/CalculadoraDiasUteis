name: CI

on:
  push:
    branches: [master, winui]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # O dotnet test só compila os projetos de teste e o que eles usam; o build antes inclui o aplicativo
      - run: dotnet build CalculadoraDiasUteis.slnx -c Release
      - run: dotnet test CalculadoraDiasUteis.slnx -c Release --no-build
